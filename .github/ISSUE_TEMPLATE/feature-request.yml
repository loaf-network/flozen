name: ✨ 新功能请求
description: 提出一个新功能建议，让 Flozen 变得更好用。
labels: ["新功能"]
body:
  - type: markdown
    attributes:
      value: |
        ## 功能建议 💡

        请描述你期望的新功能及其解决的问题。提交前，请先[搜索现有 Issue](https://github.com/loaf-network/flozen/issues)，确认没有重复建议。

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 请清晰地描述你希望添加的功能。
      placeholder: "例如：支持自定义主题色，允许用户选择品牌色以外的颜色。"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 使用场景与动机
      description: 为什么需要这个功能？你在什么场景下会遇到这个需求？
      placeholder: "例如：我经常深夜听歌，希望有一键切换夜间模式的入口。"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 功能实现后，你期望看到什么效果？可以描述交互流程。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 目前你是如何绕过这个需求的？是否考虑过其他实现方式？（可选）

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查清单
      description: 提交前，请确认以下事项。
      options:
        - label: 我已确认使用的是最新版本（可在「设置 → 关于」中检查更新）
          required: true
        - label: 我已搜索过现有 Issue，确认没有重复建议
          required: true
